<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">SOMA OS triquetra logo</title>
  <desc id="desc">Emerald and gold Celtic knotwork mark for SOMA OS.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B8C56" stop-opacity=".55"/>
      <stop offset="62%" stop-color="#1F5B3B" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="15%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#F8F3D6"/>
      <stop offset="48%" stop-color="#D9C27A"/>
      <stop offset="100%" stop-color="#8F7736"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="110" cy="110" r="104" fill="url(#halo)"/>
  <circle cx="110" cy="110" r="78" fill="none" stroke="#1F5B3B" stroke-width="2" opacity=".65"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M110 38 C70 58 62 100 94 124 C119 143 160 134 171 101 C180 74 156 45 110 38Z" stroke="url(#gold)" stroke-width="10"/>
    <path d="M47 146 C52 101 89 82 123 102 C150 118 162 157 137 181 C116 201 72 190 47 146Z" stroke="url(#gold)" stroke-width="10"/>
    <path d="M173 146 C148 190 104 201 83 181 C58 157 70 118 97 102 C131 82 168 101 173 146Z" stroke="url(#gold)" stroke-width="10"/>
    <path d="M110 69 C92 86 91 119 110 135 C129 119 128 86 110 69Z" stroke="#2B8C56" stroke-width="7"/>
    <path d="M79 145 C103 137 129 146 141 170" stroke="#2B8C56" stroke-width="7"/>
    <path d="M141 145 C117 137 91 146 79 170" stroke="#2B8C56" stroke-width="7"/>
  </g>
  <g fill="#D9C27A" opacity=".76">
    <text x="108" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="12">᚛</text>
    <text x="196" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12">ᚋ</text>
    <text x="23" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12">ᚑ</text>
  </g>
</svg>
